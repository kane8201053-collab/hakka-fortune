.wrap{
  position:relative;z-index:1;
  max-width:600px;
  margin:0 auto;
  padding-inline:20px;
  padding-block:26px 56px;
  display:flex;
  flex-direction:column;
  gap:26px;
}

/* ---------- header ---------- */
.top{display:flex;flex-direction:column;align-items:center;gap:14px}
.kv{width:100%;max-width:470px;height:auto;display:block}
.titlebar{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-top:1px solid var(--line);padding-top:14px;
}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);
}
h1{
  font-family:"Noto Serif TC",serif;font-weight:900;
  font-size:clamp(23px,6vw,29px);line-height:1.25;margin:0;
  letter-spacing:.08em;color:var(--plum);
}
.sub{color:var(--ink-2);font-size:14.5px;margin:0;text-align:center;max-width:34ch}

.sound{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink-2);border-radius:999px;padding:6px 12px;
  font-family:inherit;font-size:12.5px;cursor:pointer;
  transition:border-color .18s,color .18s;
}
.sound:hover{border-color:var(--plum);color:var(--plum)}
.sound svg{width:14px;height:14px;flex:none}
.sound .off-slash{display:none}
.sound[aria-pressed="false"] .off-slash{display:block}
.sound[aria-pressed="false"]{color:var(--muted)}

/* ---------- stage ---------- */
.stage{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:26px 20px 24px;
  display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:var(--shadow);
}
.tube-holder{width:150px;height:186px;position:relative}
.tube-svg{width:100%;height:100%;display:block;overflow:visible}
#tubeGroup{transform-box:fill-box;transform-origin:50% 90%}
.shaking #tubeGroup{animation:shake .11s linear 10}
.shaking #sticks{animation:jitter .11s linear 10}
@keyframes shake{
  0%{transform:rotate(0deg) translateX(0)}
  25%{transform:rotate(-7deg) translateX(-3px)}
  50%{transform:rotate(0deg) translateX(0)}
  75%{transform:rotate(7deg) translateX(3px)}
  100%{transform:rotate(0deg) translateX(0)}
}
@keyframes jitter{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
#popStick{transition:transform .55s cubic-bezier(.18,.85,.3,1),opacity .35s ease}
.popped #popStick{transform:translate(6px,-56px) rotate(9deg)}

.draw{
  font-family:"Noto Serif TC",serif;font-weight:600;
  font-size:19px;letter-spacing:.16em;
  color:#F8F5E9;background:var(--plum);
  border:none;border-radius:999px;
  padding:14px 40px;cursor:pointer;
  box-shadow:0 6px 18px -8px rgba(90,66,96,.9);
  transition:transform .15s ease,filter .18s ease;
}
.draw:hover{filter:brightness(1.06)}
.draw:active{transform:translateY(1px)}
.draw[disabled]{opacity:.55;cursor:default;filter:none;transform:none}
.hint{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11.5px;letter-spacing:.12em;color:var(--muted);margin:-6px 0 0;
}

/* ---------- result ---------- */
#result{display:none}
#result.show{display:block;animation:rise .5s cubic-bezier(.2,.75,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 20px;border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);
}
.seq{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;letter-spacing:.16em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.grade{
  font-family:"Noto Serif TC",serif;font-weight:600;
  font-size:13.5px;letter-spacing:.14em;
  padding:3px 13px;border-radius:999px;
  background:var(--surface);border:1px solid currentColor;
}
.g-daji{color:var(--persimmon)}
.g-shangji{color:var(--gold)}
.g-zhongji{color:var(--plum)}
.g-ji{color:var(--bamboo)}
.g-pingan{color:var(--muted)}

.card-body{padding:26px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:0}
.disc{
  width:132px;height:132px;border-radius:50%;
  background:var(--plate);
  box-shadow:inset 0 0 0 1px var(--plate-ring);
  display:grid;place-items:center;
}
.disc svg{width:104px;height:104px;display:block}
.food{
  font-family:"Noto Serif TC",serif;font-weight:900;
  font-size:clamp(26px,6.5vw,32px);line-height:1.25;
  margin:18px 0 2px;letter-spacing:.05em;text-align:center;text-wrap:balance;
}
.alias{font-size:13px;color:var(--muted);margin:0}
.poem{
  font-family:"Noto Serif TC",serif;font-weight:600;
  font-size:clamp(17px,4.6vw,19.5px);line-height:1.95;
  color:var(--plum);text-align:center;white-space:pre-line;
  margin:20px 0 0;max-width:22ch;
}
.rule{
  width:44px;height:1px;background:var(--line);
  margin:22px 0;flex:none;
}
.bless{
  margin:0;font-size:15.5px;line-height:1.95;color:var(--ink-2);
  text-align:center;max-width:30ch;
}

.action{
  margin-top:22px;width:100%;
  background:var(--surface-2);
  border:1px solid var(--line-soft);
  border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:4px;
}
.label{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
}
.action p{margin:0;font-size:15px;line-height:1.7}

.meta{
  margin-top:14px;width:100%;
  display:flex;gap:10px;flex-wrap:wrap;
}
.chip{
  flex:1 1 140px;
  border:1px solid var(--line-soft);border-radius:14px;
  padding:11px 14px;display:flex;flex-direction:column;gap:3px;
}
.chip .val{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.swatch{width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--plate-ring);flex:none}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}

.fact{
  margin-top:16px;width:100%;
  border-top:1px dashed var(--line);padding-top:14px;
  display:flex;flex-direction:column;gap:4px;
}
.fact p{margin:0;font-size:13.5px;line-height:1.8;color:var(--muted)}

.again{
  margin-top:20px;width:100%;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
#againBtn{grid-column:1/-1}
.ghost{
  width:100%;
  font-family:inherit;font-size:14.5px;
  background:transparent;color:var(--ink);
  border:1px solid var(--line);border-radius:999px;
  padding:11px 18px;cursor:pointer;
  transition:border-color .18s,color .18s,background .18s;
}
.ghost:hover{border-color:var(--plum);color:var(--plum)}
.ghost.primary{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.ghost.primary:hover{filter:brightness(1.08);color:var(--surface)}

/* ---------- index ---------- */
.index h2{
  font-family:"Noto Serif TC",serif;font-weight:600;
  font-size:16px;letter-spacing:.1em;margin:0 0 4px;
}
.index .note{font-size:13px;color:var(--muted);margin:0 0 16px}
.grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px 8px;list-style:none;padding:0;margin:0;
}
.grid li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mini{
  width:100%;aspect-ratio:1/1;max-width:64px;border-radius:50%;
  background:var(--plate);box-shadow:inset 0 0 0 1px var(--plate-ring);
  display:grid;place-items:center;
}
.mini svg{width:78%;height:78%;display:block}
.grid span{font-size:11.5px;line-height:1.4;color:var(--ink-2)}

footer{
  font-size:12.5px;color:var(--muted);line-height:1.8;
  border-top:1px solid var(--line-soft);padding-top:16px;
}
footer p{margin:0}

/* ---------- share sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:50;display:none;place-items:start center;
  padding:20px;background:rgba(46,34,48,.66);overflow:auto;
}
.sheet.open{display:grid}
.sheet-inner{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:14px;max-width:400px;width:100%;
  display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);
}
.sheet-inner img{width:100%;height:auto;border-radius:10px;display:block;background:var(--surface-2)}
.sheet-note{margin:0;font-size:12.5px;line-height:1.7;color:var(--muted);text-align:center}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions .ghost[hidden]{display:none}
.sheet-actions .ghost[hidden]+.ghost{grid-column:1/-1}

:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}

@media (max-width:380px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .draw{padding:13px 30px;font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .shaking #tubeGroup,.shaking #sticks{animation:none}
  #popStick{transition:none}
  #result.show{animation:none}
}

img{max-width:100%}

/* ---------- sound ---------- */
let soundOn = true, ctx = null;
const soundBtn = document.getElementById("soundBtn");
const soundLabel = document.getElementById("soundLabel");

function audio(){
  if(!ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    ctx = new AC();
  }
  if(ctx.state === "suspended") ctx.resume();
  return ctx;
}
function clack(at){
  const c = audio(); if(!c || !soundOn) return;
  const t = c.currentTime + at;
  const len = Math.floor(c.sampleRate * 0.07);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 1400 + Math.random()*900; bp.Q.value = 4.5;
  const g = c.createGain();
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  src.connect(bp).connect(g).connect(c.destination);
  src.start(t); src.stop(t + 0.1);
}
function chime(){
  const c = audio(); if(!c || !soundOn) return;
  const t = c.currentTime;
  [[784,0],[1175,0.06],[1568,0.12]].forEach(([f,off])=>{
    const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t+off);
    g.gain.linearRampToValueAtTime(0.16, t+off+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+off+1.1);
    o.connect(g).connect(c.destination);
    o.start(t+off); o.stop(t+off+1.2);
  });
}
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", String(soundOn));
  soundLabel.textContent = soundOn ? "音效開" : "音效關";
  if(soundOn) clack(0);
});

/* ---------- draw ---------- */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const holder = document.getElementById("tubeHolder");
const drawBtn = document.getElementById("drawBtn");
const hint = document.getElementById("hint");
const result = document.getElementById("result");
let last = -1, busy = false;

function pick(){
  let i = Math.floor(Math.random() * FORTUNES.length);
  if(FORTUNES.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random()*(FORTUNES.length-1))) % FORTUNES.length;
  last = i;
  return FORTUNES[i];
}

function render(f, i){
  document.getElementById("seq").textContent = "第 " + String(i+1).padStart(2,"0") + " 籤";
  const g = document.getElementById("grade");
  g.textContent = f.grade;
  g.className = "grade " + f.gradeClass;
  document.getElementById("foodUse").setAttribute("href", f.icon);
  document.getElementById("foodIcon").setAttribute("viewBox","0 0 100 100");
  document.getElementById("foodName").textContent = f.name;
  document.getElementById("alias").textContent = f.alias;
  document.getElementById("poem").textContent = f.poem;
  document.getElementById("bless").textContent = f.bless;
  document.getElementById("action").textContent = f.action;
  document.getElementById("colorName").textContent = f.color;
  document.getElementById("swatch").style.background = f.hex;
  document.getElementById("luckyNum").textContent = f.num;
  document.getElementById("fact").textContent = f.fact;
}

function reveal(){
  const f = pick();
  render(f, FORTUNES.indexOf(f));
  result.classList.remove("show");
  void result.offsetWidth;
  result.classList.add("show");
  chime();
  hint.textContent = "抽到「" + f.name + "」· 想再試一次就再搖一次";
  drawBtn.textContent = "再搖一次";
  drawBtn.disabled = false;
  busy = false;
  if(window.innerWidth < 700){
    result.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "start"});
  }
}

function shake(){
  if(busy) return;
  busy = true;
  drawBtn.disabled = true;
  audio();
  if(reduce){ reveal(); return; }
  holder.classList.remove("popped");
  holder.classList.add("shaking");
  for(let i=0;i<7;i++) clack(0.05 + i*0.15);
  setTimeout(()=>{
    holder.classList.remove("shaking");
    holder.classList.add("popped");
  }, 1120);
  setTimeout(reveal, 1560);
  setTimeout(()=> holder.classList.remove("popped"), 3200);
}
drawBtn.addEventListener("click", shake);
document.getElementById("againBtn").addEventListener("click", ()=>{
  holder.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "center"});
  setTimeout(shake, reduce ? 0 : 320);
});

const SERIF = '"Noto Serif TC","PingFang TC",serif';
const SANS  = '"Noto Sans TC","PingFang TC",sans-serif';
const MONO  = '"IBM Plex Mono",monospace';
const imgCache = {};

function loadImg(src){
  if(!imgCache[src]){
    imgCache[src] = new Promise((res,rej)=>{
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = src;
    });
  }
  return imgCache[src];
}
function iconImg(id){
  const sym = document.querySelector(id);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="384" height="384">' + sym.innerHTML + '</svg>';
  return loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
}
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function wrapText(c,text,maxW){
  const out=[]; let line="";
  for(const ch of text){
    if(ch === "\n"){ out.push(line); line=""; continue; }
    const t = line + ch;
    if(line && c.measureText(t).width > maxW){ out.push(line); line = ch; }
    else line = t;
  }
  if(line) out.push(line);
  return out;
}

async function buildShare(f, idx){
  // canvas text does not trigger webfont loading — ask for each face + glyph set first

    await Promise.all([
      document.fonts.load('900 70px "Noto Serif TC"', txt),
      document.fonts.load('600 42px "Noto Serif TC"', txt),
      document.fonts.load('400 29px "Noto Sans TC"', txt),
      document.fonts.load('500 30px "Noto Sans TC"', txt),
      document.fonts.load('600 25px "IBM Plex Mono"', "0123456789"),
      document.fonts.ready
    ]);
  }catch(e){}

  const W = 1080, cx0 = 64, cw = W - 128, PAD = 52, innerW = cw - PAD*2, cy0 = 300;
  const ms = document.createElement("canvas").getContext("2d");
  const poemLines = f.poem.split("\n");
  ms.font = "400 29px " + SANS;  const blessLines = wrapText(ms, f.bless, innerW - 40);
  ms.font = "400 27px " + SANS;  const actLines   = wrapText(ms, f.action, innerW - 56);

  const headH = 80, plateTop = 120, plateR = 122;
  const nameY  = plateTop + plateR*2 + 80;
  const aliasY = nameY + 40;
  const poemY  = aliasY + 74;
  const divY   = poemY + (poemLines.length-1)*60 + 48;
  const blessY = divY + 54;
  const actY   = blessY + (blessLines.length-1)*48 + 34;
  const actH   = 54 + actLines.length*38 + 16;
  const mLabY  = actY + actH + 50;
  const mValY  = mLabY + 42;
  const ch     = mValY + 48;
  const H      = cy0 + ch + 118;

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.textBaseline = "alphabetic";

  }catch(e){}

  x.save();
  x.shadowColor = "rgba(60,47,62,.22)"; x.shadowBlur = 36; x.shadowOffsetY = 14;
  x.fillStyle = "#F8F5E9"; rr(x,cx0,cy0,cw,ch,28); x.fill();
  x.restore();
  x.save(); rr(x,cx0,cy0,cw,ch,28); x.clip();
  x.fillStyle = "#EFEBD8"; x.fillRect(cx0,cy0,cw,headH);
  x.strokeStyle = "#E4DFC9"; x.lineWidth = 2;

  x.fillStyle = "#F2EEDF"; x.fill();

  x.fillStyle = f.hex; rr(x, L+4, cy0+mValY-25, 26, 26, 7); x.fill();
  x.strokeStyle = "rgba(60,47,62,.16)"; x.lineWidth = 2; rr(x, L+4, cy0+mValY-25, 26, 26, 7); x.stroke();
  x.font = "500 30px " + SANS; x.fillStyle = "#3C2F3E"; x.fillText(f.color, L+46, cy0+mValY);
  x.font = "600 34px " + MONO; x.fillText(String(f.num), mid+40, cy0+mValY);

  x.textAlign = "center"; x.font = "400 23px " + SANS; x.fillStyle = "#6B5C6C";
  x.fillText("2026 客好食光 · 臺北客家美食節　客家食福籤", mid, H-56);

  return await new Promise(res => cv.toBlob(res, "image/png"));
}

/* ---------- share sheet ---------- */
const sheet = document.getElementById("sheet");
const shotBtn = document.getElementById("shotBtn");
const shotImg = document.getElementById("shotImg");
const saveBtn = document.getElementById("saveBtn");
const sheetNote = document.getElementById("sheetNote");
let shotBlob = null, shotUrl = null, downloads = null;

const framed = !!(window.claude && typeof window.claude.use === "function");
if(framed){
  window.claude.use("downloads").then(d => {
    downloads = d;
    if(d) saveBtn.hidden = false;
  }).catch(()=>{});
}else{
  saveBtn.hidden = false;   // 獨立網頁：直接用瀏覽器下載
}

shotBtn.addEventListener("click", async () => {
  const f = FORTUNES[last]; if(!f) return;
  shotBtn.disabled = true; shotBtn.textContent = "產生中…";
  try{
    const blob = await buildShare(f, last);
    if(!blob) throw new Error("no blob");
    if(shotUrl) URL.revokeObjectURL(shotUrl);
    shotBlob = blob; shotUrl = URL.createObjectURL(blob);
    shotImg.src = shotUrl;
    shotImg.alt = f.name + " 抽籤結果分享圖";
    sheet.classList.add("open");
    saveBtn.textContent = "儲存圖片";
    sheetNote.textContent = "手機長按圖片即可存到相簿，電腦按右鍵另存圖片。";
  }catch(e){
    shotBtn.textContent = "產生失敗，請再試一次";
    setTimeout(()=>{ shotBtn.disabled = false; shotBtn.textContent = "產生分享圖"; }, 2200);
    return;
  }
  shotBtn.disabled = false; shotBtn.textContent = "產生分享圖";
});

saveBtn.addEventListener("click", async () => {
  if(!shotBlob) return;
  const f = FORTUNES[last];
  const filename = "客好食光_食福籤_" + f.name + ".png";
  if(!downloads){
    const a = document.createElement("a");
    a.href = shotUrl; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    saveBtn.textContent = "已下載";
    setTimeout(()=> saveBtn.textContent = "儲存圖片", 1800);
    return;
  }
  saveBtn.disabled = true;
  try{
    await downloads.save({ filename: filename, data: shotBlob });
    saveBtn.textContent = "已儲存";
  }catch(err){
    const code = err && err.code;
    if(code === "declined"){ saveBtn.textContent = "儲存圖片"; }
    else{
      saveBtn.hidden = true;
      sheetNote.textContent = "這裡無法直接儲存，請長按圖片（電腦按右鍵）另存。";
    }
  }
  saveBtn.disabled = false;
});

document.getElementById("closeSheet").addEventListener("click", ()=> sheet.classList.remove("open"));
sheet.addEventListener("click", e => { if(e.target === sheet) sheet.classList.remove("open"); });
document.addEventListener("keydown", e => { if(e.key === "Escape") sheet.classList.remove("open"); });
</script>
